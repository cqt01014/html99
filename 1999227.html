<p><strong><u>－1999/2/27－</u></strong></p>

<p>実家で２日間ほど休養をとった後、静岡にいったん帰ってから、スカイダイビングをする埼玉県比企郡川島町（本田エアポート）へと進路を進めました。</p>

<table border="2" cellpadding="2" bordercolor="#000000"
bordercolordark="#000000" bordercolorlight="#000000">
    <tr>
        <td><strong>○長野県長野市　発</strong></td>
    </tr>
    <tr>
        <td>＝＞　長野道　－＞　中央道　－＞　国道５２号線　＝＞</td>
    </tr>
    <tr>
        <td><strong>○静岡県清水市　経由</strong></td>
    </tr>
    <tr>
        <td>＝＞　国道１号線　－＞　国道２４６号線　－＞　国道１６号線　－＞　国道１７号線　＝＞</td>
    </tr>
    <tr>
        <td><strong>○埼玉県比企郡川島町　着</strong></td>
    </tr>
</table>

<p>移動を開始したのが午後の３時。このドライブのほとんどが夜であるため、とりあげる写真はありません。</p>
